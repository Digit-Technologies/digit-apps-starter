name: Publish NPM packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm publish --dry-run only (no registry upload)
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build @heysutton packages
        run: npm run build:packages

      - name: Verify pack smoke test
        run: npm run verify:packages

      - name: Dry-run publish all @heysutton packages
        if: env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          for pkg in lib-common lib-frontend lib-backend lib-build; do
            echo "=== npm publish --dry-run @heysutton/${pkg} ==="
            npm publish --dry-run --access public -w "@heysutton/${pkg}"
          done

      - name: Publish all @heysutton packages
        if: env.DRY_RUN != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is required for real publish"
            exit 1
          fi
          for pkg in lib-common lib-frontend lib-backend lib-build; do
            echo "=== npm publish @heysutton/${pkg} ==="
            npm publish --provenance --access public -w "@heysutton/${pkg}"
          done
