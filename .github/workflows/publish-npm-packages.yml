name: Publish NPM packages

# Manual only. Automatic publish runs in release-please.yml when
# releases_created is true. A `release: published` trigger does not run here:
# Release Please creates releases with GITHUB_TOKEN, and GitHub does not start
# workflows from events that token produces.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm publish --dry-run only (no registry upload)
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build @heysutton packages
        run: npm run build:packages

      - name: Test @heysutton packages
        run: npm test

      - name: Verify pack smoke test
        run: npm run verify:packages

      - name: Installed-package smoke test
        run: scripts/smoke-installed-packages.sh

      - name: Dry-run publish @heysutton platform libraries
        if: env.DRY_RUN == 'true'
        run: scripts/publish-packages.sh --dry-run

      - name: Publish @heysutton platform libraries
        if: env.DRY_RUN != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: scripts/publish-packages.sh
