name: Release Please

on:
  push:
    branches: [main]

# contents + pull-requests: Release Please opens the Release PR and creates the
# GitHub Release. The publish job replaces these with its own permissions.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      # "true" only when this run created GitHub releases (Release PR merged).
      releases_created: ${{ steps.release.outputs.releases_created }}
      # Sutton agent plugin (.agents). Tagged sutton-plugin-v*.
      plugin_release_created: ${{ steps.release.outputs['.agents--release_created'] }}
      # @heysutton/sdk* (linked versions, released together). Tagged sdk*-v*.
      sdk_release_created: ${{ steps.release.outputs['packages/sdk--release_created'] }}
      all: ${{ toJSON(steps.release.outputs) }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Its own job so a failure here can't skip the npm publish below. If it
  # fails, the component releases stay drafts (never "latest", so digit-api is
  # unaffected) and a re-run of this job finishes them.
  publish-component-releases:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Component releases must never become GitHub's "latest": digit-api downloads
      # the starter zip from /releases/latest. release-please can't pass
      # make_latest: false, so it creates them as drafts (drafts are never latest)
      # with the tag pushed up front (force-tag-creation), and this step
      # publishes them with --latest=false.
      - name: Publish component releases without marking them latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUTS: ${{ needs.release-please.outputs.all }}
        run: |
          set -euo pipefail
          jq -r '. as $o | ($o.paths_released | fromjson)[] | $o[. + "--tag_name"] // empty' <<<"$OUTPUTS" |
            while read -r tag; do
              case "$tag" in
                starter-*) echo "::error::refusing to touch starter release $tag"; exit 1 ;;
              esac
              echo "Publishing ${tag} (not latest)"
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
            done

  publish:
    needs: release-please
    if: needs.release-please.outputs.sdk_release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # npm publish --provenance needs the Actions OIDC token. Without
      # id-token: write the first real publish fails.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Upgrade npm for trusted publishing
        # Trusted publishing (OIDC) needs npm >= 11.5.1.
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build @heysutton packages
        run: npm run build:packages

      - name: Test @heysutton packages
        run: npm test

      - name: Verify pack smoke test
        run: npm run verify:packages

      - name: Installed-package smoke test
        run: scripts/smoke-installed-packages.sh

      - name: Publish @heysutton platform libraries
        run: scripts/publish-packages.sh
