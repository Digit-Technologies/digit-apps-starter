name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@193f062b1480aafbfa13f305f1e44cafe3e4a36 # v4.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
