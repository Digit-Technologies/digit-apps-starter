name: Test platform packages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test @heysutton packages
        run: npm test

      - name: Build @heysutton packages
        run: npm run build:packages

      - name: Dry-run npm pack
        run: |
          set -euo pipefail
          for pkg in lib-common lib-frontend lib-backend lib-build; do
            npm publish --dry-run --access public -w "@heysutton/${pkg}"
          done
