name: Lint workflows

on:
  push:
    branches: [main]
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        run: bash <(curl -sS https://raw.githubusercontent.com/rhysd/actionlint/0933c147c9d6587653d45fdcb4c497c57a65f9af/scripts/download-actionlint.bash) 1.7.10 # v1.7.10
      - name: Run actionlint
        run: ./actionlint -color

  pinact:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify actions are SHA-pinned
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          skip_push: 'true'
          review: 'true'
          github_token: ${{ github.token }}
