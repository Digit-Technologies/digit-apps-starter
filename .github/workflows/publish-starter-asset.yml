name: Publish starter asset

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.agents/**'
      - '.claude-plugin/**'
      - '.cursor-plugin/**'
      - '.codex-plugin/**'
      - 'examples/**'
      - 'packages/**'
      - 'scripts/**'
      - 'apps/**'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/workflows/publish-starter-asset.yml'
      - '.github/workflows/release-please.yml'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the zip and upload it as an artifact without creating releases
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      # PRs and non-main refs always dry-run. Real releases only from main
      # (push or workflow_dispatch with dry_run=false).
      DRY_RUN: ${{ github.ref != 'refs/heads/main' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # The repo root doubles as an agent plugin (Claude Code, Cursor, Codex). These
      # manifests are not part of the starter zip.
      - name: Validate agent plugin manifests
        run: |
          set -euo pipefail

          SKILLS="./.agents/skills/"
          for f in .claude-plugin/plugin.json .cursor-plugin/plugin.json .codex-plugin/plugin.json; do
            jq -e --arg skills "$SKILLS" '
              .name == "sutton" and
              (.version | type) == "string" and
              .skills == $skills
            ' "$f" >/dev/null || { echo "::error file=$f::unexpected plugin manifest"; exit 1; }
          done

          # One version for every agent, so a bump reaches all of them.
          versions="$(jq -r .version .claude-plugin/plugin.json .cursor-plugin/plugin.json .codex-plugin/plugin.json | sort -u)"
          if [ "$(printf '%s\n' "$versions" | wc -l)" -ne 1 ]; then
            echo "::error::plugin manifest versions differ: $(echo "$versions" | tr '\n' ' ')"
            exit 1
          fi

          jq -e '.displayName == "Sutton"' .claude-plugin/plugin.json >/dev/null
          jq -e '.displayName == "Sutton"' .cursor-plugin/plugin.json >/dev/null
          jq -e '.interface.displayName == "Sutton"' .codex-plugin/plugin.json >/dev/null

          # Release Please owns the version: its manifest must match, and every
          # plugin.json must be in the plugin component's extra-files.
          version="$(printf '%s' "$versions")"
          jq -e --arg v "$version" '.[".agents"] == $v' .release-please-manifest.json >/dev/null \
            || { echo "::error file=.release-please-manifest.json::.agents is not $version"; exit 1; }
          for f in .claude-plugin/plugin.json .cursor-plugin/plugin.json .codex-plugin/plugin.json; do
            jq -e --arg p "/$f" '
              .packages[".agents"] as $pkg |
              $pkg.component == "sutton-plugin" and
              any($pkg["extra-files"][]; .type == "json" and .path == $p and .jsonpath == "$.version")
            ' release-please-config.json >/dev/null \
              || { echo "::error file=release-please-config.json::$f is not bumped by Release Please"; exit 1; }
          done

          # Claude: version lives in plugin.json only, or the marketplace entry silently loses.
          jq -e '
            .name == "sutton" and
            any(.plugins[]; .name == "sutton" and .source == "./" and (has("version") | not))
          ' .claude-plugin/marketplace.json >/dev/null
          jq -e '
            .name == "sutton" and
            any(.plugins[]; .name == "sutton" and .source == "./")
          ' .cursor-plugin/marketplace.json >/dev/null
          jq -e '
            .name == "sutton" and
            any(.plugins[]; .name == "sutton" and .source.path == "./" and
              (.policy.installation | type) == "string" and (.category | type) == "string")
          ' .agents/plugins/marketplace.json >/dev/null

          # Every bundled skill has a SKILL.md whose name matches its folder.
          found=0
          for dir in .agents/skills/*/; do
            name="$(basename "$dir")"
            test -f "$dir/SKILL.md" || { echo "::error::$dir has no SKILL.md"; exit 1; }
            grep -Eq "^name: ${name}\$" "$dir/SKILL.md" || { echo "::error::$dir/SKILL.md name is not $name"; exit 1; }
            found=$((found + 1))
          done
          test "$found" -gt 0

      - name: Stage curated tree
        run: |
          set -euo pipefail

          STAGE="$(mktemp -d)/digit-apps-starter"
          mkdir -p "$STAGE/.agents/skills" "$STAGE/apps"

          rsync -a \
            --exclude node_modules \
            --exclude .DS_Store \
            --exclude .vite \
            .agents/skills/create-digit-app/ \
            "$STAGE/.agents/skills/create-digit-app/"

          rsync -a \
            --exclude node_modules \
            --exclude .DS_Store \
            --exclude .vite \
            examples/ \
            "$STAGE/examples/"

          rsync -a \
            --exclude node_modules \
            --exclude .DS_Store \
            packages/ \
            "$STAGE/packages/"

          rsync -a scripts/ "$STAGE/scripts/"

          cp apps/README.md "$STAGE/apps/README.md"
          cp package.json package-lock.json README.md LICENSE .gitignore "$STAGE/"

          (
            cd "$STAGE"
            node scripts/new-app.mjs app --from hello-world --no-install
          )

          test -f "$STAGE/apps/app/package.json"
          test -f "$STAGE/apps/app/manifest.json"
          test -f "$STAGE/apps/app/SPEC.md"
          test -f "$STAGE/apps/app/src/frontend/main.tsx"
          test ! -d "$STAGE/apps/app/src/backend"
          jq -e '.permissions == [] and has("backend") == false' \
            "$STAGE/apps/app/manifest.json" >/dev/null
          test ! -d "$STAGE/apps/app/frontend"
          test ! -d "$STAGE/apps/app/backend"
          test ! -f "$STAGE/apps/app/app.zip"

          # Plugin manifests are for repo installs only, not the starter zip.
          test ! -e "$STAGE/.claude-plugin"
          test ! -e "$STAGE/.cursor-plugin"
          test ! -e "$STAGE/.codex-plugin"
          test ! -e "$STAGE/.agents/plugins"

          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      # Stamped before the official templates are packed so their manifests carry this tag.
      - name: Stamp release tag
        id: release
        run: |
          set -euo pipefail

          DATE_TAG="starter-$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          {
            echo "tag=${DATE_TAG}"
            echo "sha=${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

          # Read by digit-app pack: stamps the release tag into each published app's manifest.
          jq --arg tag "$DATE_TAG" '. + {starterRelease: $tag}' "$STAGE/package.json" \
            > "$STAGE/package.json.tmp" && mv "$STAGE/package.json.tmp" "$STAGE/package.json"

          # Read by digit-api (readSkillReleaseTag): stamps this release's tag into the skill's own
          # frontmatter so a rebuilt builder session can detect a stale cached copy of the skill.
          SKILL_MD="$STAGE/.agents/skills/create-digit-app/SKILL.md"
          awk -v tag="$DATE_TAG" '
            NR==1 && $0=="---" { print; infm=1; next }
            infm==1 && $0=="---" { print "metadata:"; print "  releaseTag: " tag; print; infm=0; next }
            { print }
          ' "$SKILL_MD" > "$SKILL_MD.tmp" && mv "$SKILL_MD.tmp" "$SKILL_MD"

      # digit-api deploys examples/<name>/app.zip as-is for createApp's official templates
      # (stageOfficialTemplateZip), so the API never runs npm install. Packed on a copy without
      # the scaffolded apps/app, which the committed lockfile does not know about.
      - name: Pack official templates
        run: |
          set -euo pipefail

          PACK="$(mktemp -d)/digit-apps-starter"
          cp -R "$STAGE" "$PACK"
          rm -rf "$PACK/apps/app"
          cd "$PACK"

          npm ci --no-audit --no-fund

          # Every example ships a zip: digit-api accepts any template name the release has a zip for.
          for dir in examples/*/; do
            name="$(basename "$dir")"
            npm run pack -w "examples/$name"
            unzip -Z1 "examples/$name/app.zip" | grep -Fx 'frontend/index.js' >/dev/null
            cp "examples/$name/app.zip" "$STAGE/examples/$name/app.zip"
          done

      # Runs what the harness runs after seeding, on a copy so the archive stays clean.
      - name: Verify the seed installs and packs
        run: |
          set -euo pipefail

          CHECK="$(mktemp -d)/digit-apps-starter"
          cp -R "$STAGE" "$CHECK"
          cd "$CHECK"

          npm install --no-audit --no-fund

          # A second copy means the seed's pins disagree with lib-frontend's peers, and
          # every app built from it bundles two Reacts.
          for pkg in react react-dom @mui/material; do
            copies="$(find . -path "*/node_modules/$pkg/package.json")"
            if [ "$(printf '%s\n' "$copies" | wc -l)" -ne 1 ]; then
              echo "::error::$pkg resolves to more than one copy"
              echo "$copies"
              npm ls react react-dom @mui/material --all || true
              exit 1
            fi
          done

          npm run pack -w apps/app
          unzip -Z1 apps/app/app.zip | grep -Fx 'frontend/index.js' >/dev/null

      - name: Build curated archive
        run: |
          set -euo pipefail

          (
            cd "$(dirname "$STAGE")"
            zip -rq "$GITHUB_WORKSPACE/digit-apps-starter.zip" digit-apps-starter
          )

          echo "Archive size:"
          ls -lh digit-apps-starter.zip
          echo "Top-level entries:"
          unzip -Z1 digit-apps-starter.zip | awk -F/ 'NF<=2 {print}' | sort -u

      # Checks the bytes that ship. digit-api rejects an empty zip or one over MAX_ZIP_BYTES.
      - name: Assert official template zips
        run: |
          set -euo pipefail

          MAX_ZIP_BYTES=$((10 * 1024 * 1024))
          OUT="$(mktemp -d)"
          unzip -q digit-apps-starter.zip 'digit-apps-starter/examples/*/app.zip' -d "$OUT" || true

          failed=0
          for dir in examples/*/; do
            name="$(basename "$dir")"
            zip_path="$OUT/digit-apps-starter/examples/$name/app.zip"
            if [ ! -f "$zip_path" ]; then
              echo "::error::examples/$name/app.zip is missing from digit-apps-starter.zip"
              failed=1
              continue
            fi
            size="$(wc -c < "$zip_path" | tr -d ' ')"
            if [ "$size" -eq 0 ] || [ "$size" -gt "$MAX_ZIP_BYTES" ]; then
              echo "::error::examples/$name/app.zip is $size bytes; expected 1-$MAX_ZIP_BYTES"
              failed=1
              continue
            fi
            echo "examples/$name/app.zip: $size bytes"
          done
          exit "$failed"

      - name: Upload dry-run artifact
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digit-apps-starter
          path: digit-apps-starter.zip
          if-no-files-found: error

      # Use an immutable dated tag and mark this release as latest so
      # /releases/latest/download/... always works.
      - name: Create release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"

          NOTES="$(cat <<EOF
          Curated digit-apps-starter snapshot for agent sessions.

          - Source commit: \`${GITHUB_SHA}\`

          ### Contents
          - \`.agents/skills/create-digit-app\`
          - Pre-scaffolded, frontend-only, packable \`apps/app/\`
          - \`examples/\`, \`packages/\`, \`scripts/\`
          - Prebuilt \`examples/<name>/app.zip\` for every example
          - Root \`package.json\`, \`package-lock.json\`, \`README.md\`, \`LICENSE\`, \`.gitignore\`

          ### Download
          \`\`\`bash
          curl -fsSL -o digit-apps-starter.zip \\
            https://github.com/${{ github.repository }}/releases/latest/download/digit-apps-starter.zip
          unzip digit-apps-starter.zip
          \`\`\`
          EOF
          )"

          gh release create "$TAG" digit-apps-starter.zip \
            --title "$TAG" \
            --notes "$NOTES" \
            --latest
